apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  type: ClusterIP  # Define the type of service (ClusterIP, NodePort, LoadBalancer)
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app: mysql  # Ensure this matches the label in your MySQL deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql  # Ensure this label matches the selector in the service
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.3
        env:
          - name: MYSQL_ROOT_PASSWORD
            value: "root"
          - name: MYSQL_DATABASE
            value: "tpfoyer_db"
        ports:
          - containerPort: 3306
        volumeMounts:
          - name: mysql-persistent-storage
            mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: mysql-pvc  # Ensure this PVC is defined elsewhere in your configuration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-foyer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tp-foyer
  template:
    metadata:
      labels:
        app: tp-foyer
    spec:
      containers:
      - name: tp-foyer
        image: alachebil/tp-foyer:1.0.0
        ports:
          - containerPort: 8089
        env:
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:mysql://mysql:3306/tpfoyer_db?createDatabaseIfNotExist=true"
          - name: SPRING_DATASOURCE_USERNAME
            value: "root"
          - name: SPRING_DATASOURCE_PASSWORD
            value: "root"
          - name: SPRING_JPA_HIBERNATE_DDL_AUTO
            value: "update"
---
apiVersion: v1
kind: Service
metadata:
  name: tp-foyer
spec:
  type: ClusterIP  # Define the type of service for your application
  ports:
    - port: 8089
      targetPort: 8089
      protocol: TCP
  selector:
    app: tp-foyer  # Ensure this matches the label in your tp-foyer deployment
