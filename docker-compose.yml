version: "3.9"

services:
  mysqldb:
    image: mysql:8.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: your_password_here
    ports:
      - "3308:3308"
    volumes:
      - db:/var/lib/mysql

  app-timesheet:
    depends_on:
      - mysqldb
    image: mootazbekri/mootaz_bekri_backend_spring:1.0.0
    restart: on-failure
    ports:
      - "8089:8089"
    environment:
      SPRING_APPLICATION_JSON: >-
        {
          "spring.datasource.url": "jdbc:mysql://mysqldb:3306/firstdatabase?createDatabaseIfNotExist=true",
          "spring.datasource.username": "root",
          "spring.datasource.password": "your_password_here",
          "spring.jpa.hibernate.ddl-auto": "update"
        }
    stdin_open: true
    tty: true

volumes:
  db:
